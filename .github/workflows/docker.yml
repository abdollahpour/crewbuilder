name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - skill
          - agent
          - mcp
          - knowledge
          - crew
          - builder
          - dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # GHCR packages default to private even when the git repo is public.
      # Kubernetes nodes pull anonymously, so the package must be public.
      - name: Set GHCR package visibility to public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pkg="${{ github.event.repository.name }}%2F${{ matrix.service }}"
          if [ "${{ github.event.repository.owner.type }}" = "Organization" ]; then
            endpoint="/orgs/${{ github.repository_owner }}/packages/container/${pkg}/visibility"
          else
            endpoint="/users/${{ github.repository_owner }}/packages/container/${pkg}/visibility"
          fi
          gh api --method PUT "$endpoint" -f visibility=public \
            && echo "Package is public" \
            || echo "::warning::Could not set GHCR visibility. Set it in GitHub: Packages → ${{ matrix.service }} → Package settings → Change visibility → Public"
