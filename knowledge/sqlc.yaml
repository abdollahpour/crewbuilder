version: "2"
plugins:
  - name: py
    wasm:
      url: https://downloads.sqlc.dev/plugin/sqlc-gen-python_1.3.0.wasm
      sha256: fbedae96b5ecae2380a70fb5b925fd4bff58a6cfb1f3140375d098fbab7b3a3c
sql:
  - schema: "database.sql"
    queries: "query.sql"
    engine: postgresql
    codegen:
      - out: "src/knowledge/generated/db"
        plugin: py
        options:
          package: "knowledge.generated.db"
          emit_sync_querier: true
          emit_async_querier: false
          query_parameter_limit: 8
