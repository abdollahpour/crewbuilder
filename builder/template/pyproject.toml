[project]
name = "template"
version = "0.1.0"
description = "template using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.15,<2.0.0",
    "faiss-cpu>=1.15.0",
    "fastembed>=0.7.0",
    "langchain-community>=0.4.2",
    "ollama>=0.6.2",
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["agents", "crew.jsonc", "tools", "knowledge", "skills", "sources"]

[tool.crewai]
type = "crew"
definition = "crew.jsonc"
project_id = "02938c56-0a39-4366-9f3a-0d4642da7705"
