server {
  listen 8080;
  client_max_body_size 50m;

  location /api/v1/skills {
    proxy_pass http://skill:8080;
  }
  location /api/v1/agents {
    proxy_pass http://agent:8080;
  }
  location /api/v1/mcps {
    proxy_pass http://mcp:8080;
  }
  location /api/v1/knowledge {
    proxy_pass http://knowledge:8080;
  }
  location /api/v1/crews {
    proxy_pass http://crew:8080;
  }
  location /api/v1/builders {
    proxy_pass http://builder:8080;
  }

  location / {
    proxy_pass http://dashboard:8080;
  }
}
